<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MazeBank - Cliente Inicio</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #000;
        }

        .container {
            display: flex;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Panel izquierdo */
        .sidebar {
            background-color: #4d0000;
            flex: 1;
            border-radius: 15px;
            padding: 20px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .sidebar h1 {
            margin: 0;
            font-size: 24px;
            color: #fff;
        }

        .sidebar h1 span {
            color: #e60000;
        }

        .welcome {
            margin: 20px 0;
        }

        .search-bar {
            background: #995959;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 30px;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .menu-item {
            background: #800000;
            border-radius: 15px;
            text-align: center;
            padding: 20px;
            color: white;
        }

        /* Panel derecho */
        .content {
            flex: 2;
            background: white;
            margin-left: 20px;
            border-radius: 15px;
            position: relative;
        }

        .icon {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: #ddd;
            border-radius: 50%;
            width: 40px;
            height: 40px;
        }

        .icon.left {
            left: 15px;
            right: auto;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Panel izquierdo -->
        <div class="sidebar">
            <h1>MAZE<span>BANK</span></h1>
            <div class="welcome">
                <h3>¡Hola! Juan Pérez</h3>
                <p>Bienvenido a tu Banca en línea</p>
            </div>
            <div class="search-bar">Busca una acción a realizar</div>

            <div class="menu">
                <div class="menu-item">Transferir</div>
                <div class="menu-item">Pagar Servicio</div>
                <div class="menu-item">Historial</div>
                <div class="menu-item">Tarjetas</div>
                <div class="menu-item">Préstamo</div>
                <div class="menu-item">Perfil</div>
            </div>
        </div>

        <!-- Panel derecho -->
        <div class="content">
            <div class="icon left">👤</div>
            <div class="icon">ℹ️</div>
        </div>
    </div>
</body>

</html>
